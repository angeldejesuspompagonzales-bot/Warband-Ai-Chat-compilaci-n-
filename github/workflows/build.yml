name: Build AI Bridge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore bridge_src/Ai_bridge_system-4.7.csproj

    - name: Build with MSBuild
      run: msbuild bridge_src/Ai_bridge_system-4.7.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:OutputPath=..\publish_output\

    - name: List output files
      run: dir publish_output

    - name: Upload compiled EXE
      uses: actions/upload-artifact@v4
      with:
        name: Ai_bridge_system-4.7-Windows
        path: publish_output/
