
name: Build Warband AI Bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "bridge_src/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Buscar proyecto
        id: project
        shell: pwsh
        run: |
          $project = Get-ChildItem "bridge_src" -Filter "*.csproj" -File |
            Select-Object -First 1

          if (-not $project) {
            throw "No se encontró ningún archivo .csproj en bridge_src"
          }

          echo "path=$($project.FullName)" >> $env:GITHUB_OUTPUT

      - name: Compilar IA Bridge
        shell: pwsh
        run: |
          msbuild "${{ steps.project.outputs.path }}" `
            /restore `
            /m `
            /p:Configuration=Release

      - name: Publicar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: Warband-AI-Bridge-Windows
          path: bridge_src/bin/Release/
          if-no-files-found: error
          retention-days: 14
