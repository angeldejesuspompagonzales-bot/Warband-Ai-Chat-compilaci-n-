name: Build AI Bridge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Publish executable
      run: dotnet publish Ai_bridge_system-4.7.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseCurrentRuntimeIdentifier=false -o ./publish_output
      working-directory: ./bridge_src

    - name: Upload compiled EXE
      uses: actions/upload-artifact@v4
      with:
        name: Ai_bridge_system-4.7-Windows
        path: bridge_src/publish_output/Ai_bridge_system-4.7.exe
